name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build, testes e cobertura mínima de 70%
        run: mvn --batch-mode clean verify

      - name: Verificar WAR
        run: test -s target/obrasync.war

      - name: Validar build Docker
        run: docker build -f docker/wildfly/Dockerfile -t obrasync:ci .
