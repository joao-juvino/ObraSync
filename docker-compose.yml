services:
  postgres_obrasync:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copie .env.example para .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway_obrasync:
    image: flyway/flyway:9.22.3
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres_obrasync:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 60
      FLYWAY_VALIDATE_ON_MIGRATE: 'true'
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres_obrasync:
        condition: service_healthy

  wildfly_obrasync:
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres_obrasync:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OBRASYNC_JWT_SECRET: ${OBRASYNC_JWT_SECRET:?Defina OBRASYNC_JWT_SECRET}
      OBRASYNC_UPLOAD_DIR: /opt/jboss/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evidencias:/opt/jboss/uploads
    depends_on:
      flyway_obrasync:
        condition: service_completed_successfully

volumes:
  pgdata:
  evidencias:
